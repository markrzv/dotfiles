$mainMod = SUPER

# apps
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, exec, $browser
bind = $mainMod, T, exec, $code
bind = $mainMod, A, exec, $code ~/dotfiles
bind = $mainMod, D, exec, discord
bind = $mainMod, L, exec, $menu
bind = , PRINT, exec, ~/.config/hypr/scripts/screenshot.sh

# windows
bind = $mainMod, C, killactive,
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen, 1
bind = $mainMod CTRL, F, fullscreen, 0
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod SHIFT, mouse:272, resizewindow
bindm = $mainMod, mouse:273, resizewindow

# system
bind = $mainMod, ESCAPE, exec, loginctl lock-session
bind = $mainMod, M, exec, ~/.config/hypr/scripts/powermenu.sh
bind = $mainMod, R, exec, nmcli device wifi rescan
bind = $mainMod, SPACE, exec, hyprctl switchxkblayout current next

# workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = CTRL ALT, right, workspace, +1
bind = CTRL ALT, left, workspace, -1
bind = CTRL ALT SHIFT, right, movetoworkspace, e+1
bind = CTRL ALT SHIFT, left, movetoworkspace, e-1
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# scratchpad
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# volume, brightness
bindel = , XF86AudioRaiseVolume, exec, ~/.config/hypr/scripts/osd.sh volume-up
bindel = , XF86AudioLowerVolume, exec, ~/.config/hypr/scripts/osd.sh volume-down
bindel = , XF86AudioMute, exec, ~/.config/hypr/scripts/osd.sh volume-mute
bindel = , XF86AudioMicMute, exec, ~/.config/hypr/scripts/osd.sh mic-mute
bindel = , XF86MonBrightnessUp, exec, ~/.config/hypr/scripts/osd.sh brightness-up
bindel = , XF86MonBrightnessDown, exec, ~/.config/hypr/scripts/osd.sh brightness-down

# media
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# lid, super+p brings the screen back if it stays black
bindl = , switch:on:Lid Switch, exec, ~/.config/hypr/scripts/lid.sh close
bindl = , switch:off:Lid Switch, exec, ~/.config/hypr/scripts/lid.sh open
bind = $mainMod, P, exec, ~/.config/hypr/scripts/lid.sh open
