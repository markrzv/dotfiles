windowrule {
    name = zen
    match:class = ^(app.zen_browser.zen)$
    workspace = 1
}

windowrule {
    name = code
    match:class = ^(code)$
    workspace = 2
}

windowrule {
    name = discord
    match:class = ^(discord)$
    workspace = 3
}

windowrule {
    name = slack
    match:class = ^(Slack)$
    workspace = 3
}

windowrule {
    name = spotify
    match:class = ^(spotify)$
    workspace = 4
}

windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

windowrule {
    name = move-hyprland-run
    match:class = hyprland-run
    move = 20 monitor_h-120
    float = yes
}
