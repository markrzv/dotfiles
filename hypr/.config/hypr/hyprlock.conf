general {
    hide_cursor = true
}

background {
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
}

label {
    text = $TIME
    font_family = JetBrainsMono Nerd Font
    font_size = 80
    color = rgb(cad3f5)
    position = 0, 120
    halign = center
    valign = center
}

label {
    text = cmd[update:60000] date +"%A, %d.%m."
    font_family = JetBrainsMono Nerd Font
    font_size = 18
    color = rgb(a5adcb)
    position = 0, 40
    halign = center
    valign = center
}

input-field {
    size = 300, 50
    rounding = 10
    outline_thickness = 2
    outer_color = rgb(8aadf4) rgb(c6a0f6) 45deg
    inner_color = rgb(24273a)
    font_color = rgb(cad3f5)
    check_color = rgb(a6da95)
    fail_color = rgb(ed8796)
    placeholder_text = Password
    fail_text = Wrong password
    fade_on_empty = false
    position = 0, -60
    halign = center
    valign = center
}
